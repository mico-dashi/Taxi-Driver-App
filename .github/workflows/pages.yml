# Publishes the live web app to https://<owner>.github.io/<repo>/ and the
# offline demo to https://<owner>.github.io/<repo>/demo/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: >
          flutter build web --release --output=../site/demo
          --base-href "/${{ github.event.repository.name }}/demo/"
      - run: >
          flutter build web --release --output=build/live
          --dart-define-from-file=config/live.json
          --base-href "/${{ github.event.repository.name }}/"
      - run: cp -r build/live/. ../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
